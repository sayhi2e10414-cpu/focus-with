name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore protected signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focuswith-release.p12"
          chmod 600 "$RUNNER_TEMP/focuswith-release.p12"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/focuswith-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:lintRelease
      - name: Verify and package APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "FocusWith-Android-${GITHUB_REF_NAME}.apk"
          sha256sum "FocusWith-Android-${GITHUB_REF_NAME}.apk" > "FocusWith-Android-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: |
            FocusWith-Android-${{ github.ref_name }}.apk
            FocusWith-Android-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"
      - name: Test and publish Windows companion
        shell: pwsh
        run: ./windows/FocusFloat/build.ps1 -Configuration Release -Runtime win-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            windows/FocusFloat/artifacts/FocusWith-Windows-win-x64.zip
            windows/FocusFloat/artifacts/FocusWith-Windows-win-x64.zip.sha256
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release checksums
        working-directory: release-assets
        run: |
          sha256sum --check "FocusWith-Android-${GITHUB_REF_NAME}.apk.sha256"
          sha256sum --check "FocusWith-Windows-win-x64.zip.sha256"
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title="$(sed -n 's/^# //p' RELEASE_NOTES.md | head -n 1)"
          test -n "$release_title"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "$release_title" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
